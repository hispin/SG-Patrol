apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.sensoguard.detectsensor"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 159
        versionName "1.159"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("sensorKeystore.jks")
            storePassword "sensor1234"
            keyAlias "sensoralias"
            keyPassword "sensor1234"
        }
    }

    bundle {
        //prevent google play filter the resource that the device does not support
        language {
            enableSplit = false
        }
    }


    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            //bug fixed:the email (javax) is not been sent when minifyEnabled = true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = "FULL"
        }
        debug {
            ext.alwaysUpdateBuildId = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            pickFirsts.add('META-INF/NOTICE.md')
            pickFirsts.add('META-INF/LICENSE.md')
        }
    }
    ndkVersion = '29.0.14033849 rc4'
    namespace = 'com.sensoguard.detectsensor'
}

configurations {
    all {
        exclude module: 'commons-logging'
        exclude group: 'com.mapbox.common', module: 'common'
    }
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.1'
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'

    // AndroidX Test dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'

    implementation 'com.google.android.things:androidthings:1.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.github.kai-morich:usb-serial-for-android:1.7.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'com.github.felHR85:UsbSerial:6.0.6'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'

    //map box
    implementation 'com.mapbox.maps:android-ndk27:11.14.4'

    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-geojson:6.9.0'


    //email sending
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    //Bug fixed:cannot get permission for USB
    implementation "androidx.work:work-runtime-ktx:2.11.2"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation 'com.squareup:android-times-square:1.7.11@aar'

}
