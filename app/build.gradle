apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

//apply plugin: 'com.google.gms.google-services'

//apply plugin: 'kotlin-android-extensions'

//apply plugin: 'com.google.firebase.crashlytics'

//apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.sensoguard.detectsensor"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 152
        versionName "1.152"
        vectorDrawables.useSupportLibrary = true
        //testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("sensorKeystore.jks")
            storePassword "sensor1234"
            keyAlias "sensoralias"
            keyPassword "sensor1234"
        }
    }

    bundle {
        //prevent google play filter the resource that the device does not support
        language {
            enableSplit = false
        }
    }


    buildTypes {
        release {
            //debuggable true
            //signingConfig signingConfigs.debug
            signingConfig signingConfigs.release
            //ext.enableCrashlytics = true

            //bug fixed:the email (javax) is not been sent when minifyEnabled = true
            minifyEnabled false
            //buildConfigField "Boolean", "REPORT_CRASH", 'true'
            //minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = "FULL"
        }
        debug {
            ext.alwaysUpdateBuildId = false
//            //ext.enableCrashlytics = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            //buildConfigField "Boolean", "REPORT_CRASH", 'false'
            debuggable true
//            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            pickFirsts.add('META-INF/NOTICE.md')
            pickFirsts.add('META-INF/LICENSE.md')
        }
    }
    ndkVersion '29.0.14033849 rc4'
    namespace 'com.sensoguard.detectsensor'
}

configurations {
    all {
        exclude module: 'commons-logging'
        exclude group: 'com.mapbox.common', module: 'common'
    }
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.android.support:appcompat-v7:34.1.1'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:support-v4:34.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.activity:activity:1.12.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.google.android.things:androidthings:1.0'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.github.kai-morich:usb-serial-for-android:1.7.0'
    implementation 'com.android.support:design:34.0.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'com.github.felHR85:UsbSerial:6.0.6'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'

    //map box
    implementation 'com.mapbox.maps:android-ndk27:11.14.4'
    //implementation 'com.mapbox.maps:android:11.14.4'

    //implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-locationlayer:0.11.0'
    //implementation 'com.mapbox.mapboxsdk:mapbox-sdk-services:5.8.0'


//    implementation 'com.mapbox.mapboxsdk:mapbox-android-sdk:9.5.0'
    //implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-offline-v9:0.7.0'
    //implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-building-v9:0.7.0'
    //implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-annotation-v9:0.9.0'
    //implementation 'com.mapbox.mapboxsdk:mapbox-android-plugin-markerview-v7:0.2.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-geojson:6.9.0'


    //email sending
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    //Bug fixed:cannot get permission for USB
    implementation "androidx.work:work-runtime-ktx:2.11.0"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.10.0"
    implementation 'com.squareup:android-times-square:1.7.11@aar'

}
